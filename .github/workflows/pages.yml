# Publiceert de map app/ op GitHub Pages.
# Eenmalig: Settings → Pages → Source: "GitHub Actions".
# De Mapbox-sleutel komt uit de repository variable MAPBOX_TOKEN
# (Settings → Secrets and variables → Actions → Variables) en wordt bij het publiceren ingevuld.
name: Publiceer op GitHub Pages
on:
  push:
    branches: [Main, main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publiceer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - name: Mapbox-sleutel invullen
        env:
          MAPBOX_TOKEN: ${{ vars.MAPBOX_TOKEN }}
        run: |
          if [ -z "$MAPBOX_TOKEN" ]; then
            echo "::warning::Geen MAPBOX_TOKEN ingesteld: de kaarten werken alleen met een sleutel in de app-instellingen."
            exit 0
          fi
          node -e '
            const fs = require("fs"), p = "app/js/config.js";
            const oud = fs.readFileSync(p, "utf8");
            const nieuw = oud.replace(/mapboxSleutel: "[^"]*"/, "mapboxSleutel: " + JSON.stringify(process.env.MAPBOX_TOKEN.trim()));
            if (nieuw === oud) { console.error("mapboxSleutel niet gevonden in config.js"); process.exit(1); }
            fs.writeFileSync(p, nieuw);
            console.log("Mapbox-sleutel ingevuld.");
          '
      - uses: actions/upload-pages-artifact@v3
        with: { path: app }
      - id: deploy
        uses: actions/deploy-pages@v4
